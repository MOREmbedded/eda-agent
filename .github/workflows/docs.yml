name: Website

# Builds the product website from docs/ with MkDocs Material and
# publishes it to GitHub Pages (https://morembedded.github.io/eda-agent/).
# Pull requests only build it, with --strict, so a broken link or a page
# missing from the nav fails before it reaches main.
#
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
      - "website/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "assets/**"
      - "website/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: python -m pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
      - name: Build (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: python -m mkdocs build --strict
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
