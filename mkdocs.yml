# The product website, published to GitHub Pages by
# .github/workflows/docs.yml. Build it locally with:
#   python -m pip install -e ".[site]"
#   python -m mkdocs serve
site_name: eda-agent
site_description: Let an AI work inside your live Altium Designer session. An MCP server with around 700 tools for schematic, PCB, library and design review.
site_url: https://morembedded.github.io/eda-agent/
repo_url: https://github.com/MOREmbedded/eda-agent
repo_name: MOREmbedded/eda-agent
edit_uri: edit/main/docs/
copyright: Apache-2.0 · Maintained by MOREmbedded · Not affiliated with Altium Limited

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: website/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - announce.dismiss

extra_css:
  - stylesheets/extra.css

hooks:
  - website/hooks.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Links that leave docs/ (CHANGELOG, LICENSE, source files) are rewritten
# to GitHub by website/hooks.py, so they are not reported here.
validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MOREmbedded/eda-agent
      name: eda-agent on GitHub

