      - PCB toolkit calculators: PCB_TOOLKIT.md
      - IPC standards and rule values: IPC_STANDARDS.md
      - EMI/EMC and RF field solving: EMC_RF.md
      - Thermal analysis: THERMAL.md
      - PDN analysis: PDN.md
      - Simulation engines: SIMULATION.md
      - Transmission lines: SI_LINES.md
      - Routed nets and pairs: SI_NETS.md
      - Eyes and SPICE models: SI_TIME.md
