      - Features and dependencies: FEATURES_AND_DEPENDENCIES.md
      - Design modes: DESIGN_MODES.md
      - Autonomous design: AUTONOMOUS_DESIGN.md
      - NPI phase gates: NPI_PHASE_GATES.md
      - Part sourcing: PART_SOURCING.md
      - EDA backends: BACKENDS.md
      - Engineering tools: ENGINEERING_TOOLS.md
